// CommunicationDebuggingTools — 引擎对外唯一契约（gRPC / 方案 A）
syntax = "proto3";
package sf.engine.v1;
option csharp_namespace = "CommunicationDebuggingTools.Contracts.V1";

message RpcResult {
  bool ok = 1;
  string message = 2;
  string error_code = 3;
}
message Empty {}

message DeviceDto {
  string id = 1;
  string name = 2;
  string model = 3;
  string protocol = 4;
  string ip = 5;
  int32 port = 6;
  int32 station_no = 7;
  string extra_settings_json = 8;
  string byte_order = 9;
  string word_order = 10;
  string string_encoding = 11;
  string lane = 12;
  bool is_connected = 13;
  string status_type = 14;
  string status_text = 15;
}

message ListDevicesRequest {}
message ListDevicesResponse { repeated DeviceDto devices = 1; }
message UpsertDeviceRequest { DeviceDto device = 1; }
message UpsertDeviceResponse { DeviceDto device = 1; RpcResult result = 2; }
message DeleteDeviceRequest { string id = 1; }
message DeleteDeviceResponse { RpcResult result = 1; }
message ConnectRequest { string id = 1; }
message ConnectResponse { RpcResult result = 1; DeviceDto device = 2; }
message DisconnectRequest { string id = 1; }
message DisconnectResponse { RpcResult result = 1; DeviceDto device = 2; }
message DisconnectAllRequest {}
message DisconnectAllResponse { RpcResult result = 1; }
message DeviceEvent {
  string device_id = 1;
  DeviceDto device = 2;
  string event_kind = 3;
}

message VariableDto {
  string id = 1;
  string device_id = 2;
  string name = 3;
  string address = 4;
  string data_type = 5;
  string access = 6;
  int32 length = 7;
  string unit = 8;
  string category = 9;
  string description = 10;
  string last_value = 11;
  string quality = 12;
  string last_error = 13;
}

message ListVariablesRequest { string device_id = 1; }
message ListVariablesResponse { repeated VariableDto variables = 1; }
message UpsertVariableRequest { VariableDto variable = 1; }
message UpsertVariableResponse { VariableDto variable = 1; RpcResult result = 2; }
message DeleteVariableRequest { string id = 1; }
message DeleteVariableResponse { RpcResult result = 1; }
message ReadVariableRequest { string id = 1; }
message ReadVariableResponse { RpcResult result = 1; VariableDto variable = 2; }
message WriteVariableRequest { string id = 1; string value = 2; }
message WriteVariableResponse { RpcResult result = 1; VariableDto variable = 2; }
message VariableValueEvent {
  string variable_id = 1;
  string device_id = 2;
  string last_value = 3;
  string quality = 4;
  string last_error = 5;
}

message ListProtocolsRequest {}
message ListProtocolsResponse { repeated string protocol_names = 1; }
message HealthRequest {}
message HealthResponse {
  bool ok = 1;
  string version = 2;
  int32 device_count = 3;
  int32 variable_count = 4;
  int32 connected_device_count = 5;
}

service Engine {
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc ListProtocols (ListProtocolsRequest) returns (ListProtocolsResponse);
  rpc ListDevices (ListDevicesRequest) returns (ListDevicesResponse);
  rpc UpsertDevice (UpsertDeviceRequest) returns (UpsertDeviceResponse);
  rpc DeleteDevice (DeleteDeviceRequest) returns (DeleteDeviceResponse);
  rpc Connect (ConnectRequest) returns (ConnectResponse);
  rpc Disconnect (DisconnectRequest) returns (DisconnectResponse);
  rpc DisconnectAll (DisconnectAllRequest) returns (DisconnectAllResponse);
  rpc ListVariables (ListVariablesRequest) returns (ListVariablesResponse);
  rpc UpsertVariable (UpsertVariableRequest) returns (UpsertVariableResponse);
  rpc DeleteVariable (DeleteVariableRequest) returns (DeleteVariableResponse);
  rpc ReadVariable (ReadVariableRequest) returns (ReadVariableResponse);
  rpc WriteVariable (WriteVariableRequest) returns (WriteVariableResponse);
  rpc WatchDevices (Empty) returns (stream DeviceEvent);
  rpc WatchVariables (Empty) returns (stream VariableValueEvent);
}

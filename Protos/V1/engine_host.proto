syntax = "proto3";

package communicationkernel.enginehost.v1;
option csharp_namespace = "CommunicationKernel.EngineHost.Grpc.V1";

// -----------------------------------------------------------------------------
// 文件: engine_host.proto
// 作用: EngineHost gRPC 对外契约（协议无关模型）。
// 说明:
// 1) RegisterRoute 用于一次性注册路由并完成插件组装。
// 2) Read/Write 只使用 route_id，避免 UI 端依赖协议细节字段。
// 3) WatchRouteStatus 提供实时状态流，支持多 UI 监控 PLC 状态。
// -----------------------------------------------------------------------------
service EngineHostApi {
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc GetDiagnostics (DiagnosticsRequest) returns (DiagnosticsResponse);

  rpc RegisterRoute (RegisterRouteRequest) returns (RegisterRouteResponse);
  rpc RemoveRoute   (RemoveRouteRequest)   returns (RemoveRouteResponse);
  rpc QueryRoutes   (QueryRoutesRequest)   returns (QueryRoutesResponse);

  rpc QueryProtocols (QueryProtocolsRequest) returns (QueryProtocolsResponse);
  rpc QuerySerialPorts (QuerySerialPortsRequest) returns (QuerySerialPortsResponse);

  rpc Read  (ReadRequest)  returns (ReadResponse);
  rpc Write (WriteRequest) returns (WriteResponse);

  rpc WatchRouteStatus (WatchRouteStatusRequest) returns (stream RouteStatusEvent);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string host_version = 2;
  int32 route_count = 3;
}

message DiagnosticsRequest {}

message DiagnosticsResponse {
  string request_id = 1;
  int32 route_count = 2;
  string host_version = 3;
  // 已注册但尚未完成装配的路由数（占位中）
  int32 pending_route_count = 4;
}

message RegisterRouteRequest {
  string route_id = 1;
  string protocol_id = 2;
  string transport_id = 3;
  string transport_kind = 4;

  string address = 5;
  int32 port = 6;
  string station = 7;

  string serial_port = 8;
  int32 baud_rate = 9;

  int32 min_io_interval_ms = 10;

  // 串口线路参数。留空/为 0 时服务端取默认值 8N1。
  // 现场并非都是 8N1——Modbus ASCII 常用 7E1，部分老设备用 8E1，
  // 缺少这三项会导致这些设备根本无法通信。
  string parity    = 11;  // None / Even / Odd / Mark / Space
  int32  data_bits = 12;  // 5-8
  string stop_bits = 13;  // One / OnePointFive / Two
}

message RegisterRouteResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
  string route_id = 4;
}

message QueryRoutesRequest {
  string route_id = 1;
  string protocol_id = 2;
  string transport_kind = 3;
  string address = 4;
}

message RouteItem {
  string route_id = 1;
  string protocol_id = 2;
  string transport_id = 3;
  string transport_kind = 4;
  string address = 5;
  int32 port = 6;
  string station = 7;
  string serial_port = 8;
  int32 baud_rate = 9;
}

message QueryRoutesResponse {
  repeated RouteItem routes = 1;
}

message ReadRequest {
  string route_id = 1;
  string data_address = 2;
  int32 length = 3;
}

message ReadResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
  bytes data = 4;
}

message WriteRequest {
  string route_id = 1;
  string data_address = 2;
  bytes data = 3;
}

message WriteResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
}

// RemoveRoute — 删除路由（从 EngineHost 中注销并断开 PLC 连接）
message RemoveRouteRequest {
  string route_id = 1;
}

message RemoveRouteResponse {
  bool   success       = 1;
  string error_code    = 2;
  string error_message = 3;
}

// QueryProtocols — 查询服务端已加载的协议插件列表
message QueryProtocolsRequest {}

// 协议描述符：UI 据此渲染设备表单，无需内置任何协议知识
message ProtocolDescriptor {
  // 协议唯一标识，UI 必须原样回填到 RegisterRouteRequest.protocol_id
  string protocol_id = 1;
  // 展示名，仅用于界面显示，不参与匹配
  string display_name = 2;
  // 该协议支持的传输介质列表（"Tcp" / "Serial"）。
  //
  // 帧格式与传输介质是两个独立维度：Modbus RTU 既能跑 RS-485，
  // 也能经 TCP 转串口透传装置（Moxa NPort、USR-TCP232 等）跑以太网，
  // 因此这里是列表而非单值。
  //
  // UI 在列表长度大于 1 时应展示介质选择器，并按所选介质
  // 填充 transport_kind、切换「IP+端口」或「串口+波特率」表单。
  repeated string supported_transports = 3;
  // 是否需要站号 / 从站地址；false 时 UI 应隐藏站号输入框
  bool requires_station = 4;
  // 站号取值范围提示文案，可直接展示给操作员
  string station_hint = 5;
}

message QueryProtocolsResponse {
  repeated ProtocolDescriptor protocols = 1;
}

// QuerySerialPorts — 查询「服务端所在机器」上可用的串口
//
// 为什么必须由服务端枚举：串口长在跑通讯的那台机器上。
// 宿主部署在树莓派、上位机在办公室 PC 时，上位机列出的 COM1/COM2
// 是它自己的，与 PLC 毫无关系——选中后注册必然失败，
// 而错误信息会指向"打不开 COM1"，把人往完全错误的方向引。
message QuerySerialPortsRequest {}

// 一个可用串口
message SerialPortDescriptor {
  // 直接回填到 RegisterRouteRequest.serial_port 的设备名。
  // Windows 形如 "COM3"，Linux 形如 "/dev/ttyUSB0"
  string port_name = 1;
  // 面向操作员的补充说明，可为空。
  //
  // Linux 上通常是 /dev/serial/by-id/... 稳定路径：多个 USB 串口同时插着时，
  // ttyUSB 的编号取决于枚举顺序，重启后可能对调，
  // 而接错 PLC 的代价远大于读不到数据。
  string description = 2;
}

message QuerySerialPortsResponse {
  repeated SerialPortDescriptor ports = 1;
}

message WatchRouteStatusRequest {
  string route_id = 1;
}

message RouteStatusEvent {
  string route_id = 1;
  bool online = 2;
  string error_code = 3;
  string error_message = 4;
  int64 timestamp_unix_ms = 5;
}

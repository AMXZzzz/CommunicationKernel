syntax = "proto3";

package communicationkernel.enginehost.v1;
option csharp_namespace = "CommunicationKernel.EngineHost.Grpc.V1";

// -----------------------------------------------------------------------------
// 文件: engine_host.proto
// 作用: EngineHost gRPC 对外契约（协议无关模型）。
// 说明:
// 1) RegisterRoute 用于一次性注册路由并完成插件组装。
// 2) Read/Write 只使用 route_id，避免 UI 端依赖协议细节字段。
// 3) WatchRouteStatus 提供实时状态流，支持多 UI 监控 PLC 状态。
// -----------------------------------------------------------------------------
service EngineHostApi {
  rpc Health (HealthRequest) returns (HealthResponse);
  rpc GetDiagnostics (DiagnosticsRequest) returns (DiagnosticsResponse);

  rpc RegisterRoute (RegisterRouteRequest) returns (RegisterRouteResponse);
  rpc QueryRoutes (QueryRoutesRequest) returns (QueryRoutesResponse);

  rpc Read (ReadRequest) returns (ReadResponse);
  rpc Write (WriteRequest) returns (WriteResponse);

  rpc WatchRouteStatus (WatchRouteStatusRequest) returns (stream RouteStatusEvent);
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string host_version = 2;
  int32 route_count = 3;
}

message DiagnosticsRequest {
  bool include_routes = 1;
  bool include_subscriptions = 2;
  bool include_queues = 3;
}

message DiagnosticsResponse {
  string request_id = 1;
  int32 route_count = 2;
  int32 subscription_count = 3;
  int32 write_queue_count = 4;
  string host_version = 5;
}

message RegisterRouteRequest {
  string route_id = 1;
  string protocol_id = 2;
  string transport_id = 3;
  string transport_kind = 4;

  string address = 5;
  int32 port = 6;
  string station = 7;

  string serial_port = 8;
  int32 baud_rate = 9;

  int32 min_io_interval_ms = 10;
}

message RegisterRouteResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
  string route_id = 4;
}

message QueryRoutesRequest {
  string route_id = 1;
  string protocol_id = 2;
  string transport_kind = 3;
  string address = 4;
}

message RouteItem {
  string route_id = 1;
  string protocol_id = 2;
  string transport_id = 3;
  string transport_kind = 4;
  string address = 5;
  int32 port = 6;
  string station = 7;
  string serial_port = 8;
  int32 baud_rate = 9;
}

message QueryRoutesResponse {
  repeated RouteItem routes = 1;
}

message ReadRequest {
  string route_id = 1;
  string data_address = 2;
  int32 length = 3;
}

message ReadResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
  bytes data = 4;
}

message WriteRequest {
  string route_id = 1;
  string data_address = 2;
  bytes data = 3;
}

message WriteResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
}

message WatchRouteStatusRequest {
  string route_id = 1;
}

message RouteStatusEvent {
  string route_id = 1;
  bool online = 2;
  string error_code = 3;
  string error_message = 4;
  int64 timestamp_unix_ms = 5;
}
